<template>
	<lightning-quick-action-panel size="large">
		<lightning-card title="Order Product Entry">
			<template if:true={isLoading}>
				<div class="slds-is-relative" style="height: 400px;">
					<div class="slds-text-align_center slds-p-top_xx-large">
						<div class="slds-spinner slds-spinner_large" role="status">
							<span class="slds-assistive-text">Loading</span>
							<div class="slds-spinner__dot-a"></div>
							<div class="slds-spinner__dot-b"></div>
						</div>
					</div>
				</div>
			</template>

			<template if:false={isLoading}>
				<template if:true={isPage1}>
					<template if:true={errorMessage}>
						<div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_small" role="alert">
							<span class="slds-assistive-text">Error</span>
							<span class="slds-icon_container slds-icon-utility-error slds-m-right_x-small"
								title="Error">
								<span class="slds-assistive-text">Error</span>
							</span>
							<h2>{errorMessage}</h2>
						</div>
					</template>

					<template if:true={isAccountDead}>
						<div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_small" role="alert">
							You can't place an order on a Dead Parent Account or Location.
						</div>
					</template>

					<template if:true={isPriceBookInactive}>
						<div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_small" role="alert">
							The Price Book related to this Account is not Active, please go back and contact the
							Administrator.
						</div>
					</template>

					<template if:true={isServiceSuspended}>
						<div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_small" role="alert">
							You can't place an order because the Service status on the Parent Account of this Location
							is Suspended.
						</div>
					</template>

					<template if:true={showAccountDeadMessage}>
						<div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_small" role="alert">
							No Price Book found on the Account. Please go back and select one before placing an order.
						</div>
					</template>

					<div class="slds-p-around_large">
						<div class="slds-grid slds-wrap">
							<div class="slds-col slds-size_1-of-2">
								<lightning-input label="Account" value={accountName} class="slds-p-right_medium" disabled>
								</lightning-input>
							</div>

							<div class="slds-col slds-size_1-of-4">
								<lightning-combobox label="Order Type" value={orderType} options={orderTypes}
									onchange={handleOrderTypeChange} class="slds-p-right_medium">
								</lightning-combobox>
							</div>

							<div class="slds-col slds-size_1-of-4">
								<lightning-combobox label="Contact" value={selectedContactId} options={contactOptions}
									onchange={handleContactChange}>
								</lightning-combobox>
							</div>
						</div>

						<div class="slds-grid slds-wrap slds-m-top_small">

							<div class="slds-col slds-size_1-of-4">
								<lightning-input label="PO Number" value={poNumber} required={showPORequired}
									onchange={handlePONumberChange} class="slds-p-right_medium">
								</lightning-input>
							</div>


							<div class="slds-col slds-size_1-of-4">
								<lightning-input type="date" label="Requested Delivery Date"
									value={requestedDeliveryDate} onchange={handleDeliveryDateChange}>
								</lightning-input>
							</div>
						</div>

						<div class="slds-m-top_medium">
							<lightning-textarea label="Order Delivery Notes" value={deliveryNotes}
								onchange={handleDeliveryNotesChange}>
							</lightning-textarea>
						</div>

						<template if:true={hasDeliveryDays}>
							<div class="slds-m-top_small">
								<lightning-input label="FM Specialised Collection Days"
									value={accountDetails.deliveryDays} disabled>
								</lightning-input>
							</div>
						</template>

						<div class="slds-m-top_medium slds-text-align_right">
							<lightning-button label="Next" variant="brand" onclick={goToPage2} disabled={isDisabled}>
							</lightning-button>
						</div>
					</div>
				</template>

				<template if:true={isPage2}>
					<lightning-card title="Selected Products">
						<div class="slds-p-around_top slds-p-around_bottom">
							<table class="slds-table slds-table_cell-buffer slds-table_bordered">
								<thead>
									<tr class="slds-text-title_caps">
										<th scope="col"></th>
										<th scope="col">Product</th>
										<th scope="col">Supplier</th>
										<th scope="col">Quantity</th>
										<th scope="col">Disc Type</th>
										<th scope="col">List Price</th>
										<th scope="col" class="slds-text-align_right">Disc Amount</th>
										<th scope="col" class="slds-text-align_right">Unit Price</th>
										<th scope="col">Supplier Unit Price</th>
									</tr>
								</thead>
								<tbody>
									<template for:each={shoppingCart} for:item="item" for:index="index">
										<tr key={item.rowKey}>
											<td>
												<lightning-button-icon icon-name="utility:delete" variant="container"
													class="slds-truncate" alternative-text="Remove"
													onclick={handleRemoveItem} data-id={item.rowKey} title="Remove">
												</lightning-button-icon>
											</td>
											<td>
												<lightning-input type="text" variant="label-hidden" value={item.manualProductName}
													onchange={handleProductNameChange} data-id={item.rowKey}>
												</lightning-input>
											</td>
											<td>
												<span class="slds-text-align_right">
													{item.supplierName}
												</span>
											</td>
											<td>
												<div class="counter">
													<lightning-button-icon icon-name="utility:chevronleft"
														variant="bare" alternative-text="Decrease" data-id={item.rowKey}
														onclick={decrease}>
													</lightning-button-icon>

													<span class="value">{item.quantity}</span>

													<lightning-button-icon icon-name="utility:chevronright"
														variant="bare" alternative-text="Increase" data-id={item.rowKey}
														onclick={increase}>
													</lightning-button-icon>
												</div>
											</td>
											<td>
												<template if:false={item.showDiscountDropdown}>
													<span class="slds-truncate">{item.discountLabel}</span>
												</template>

												<template if:true={item.showDiscountDropdown}>
													<lightning-combobox value={item.discountToApply} options={discountOptions}
														data-id={item.rowKey} variant="label-hidden" onchange={handleDiscountToApplyChange}>
													</lightning-combobox>
												</template>
											</td>
											<td>
												<lightning-input type="number" value={item.listPrice}
													onchange={handleListPriceChange} data-id={item.rowKey} required="true"
													variant="label-hidden" step="any">
												</lightning-input>
											</td>
											<td class="slds-text-align_right">
												<span>{currencySign}{item.discount}</span>
											</td>
											<td class="slds-text-align_right">
												<span>{currencySign}{item.unitPrice}</span>
											</td>
											<td>
												<template if:false={isSupplierPriceEditable}>
													<span class="slds-truncate">{item.supplierUnitPrice}</span>
												</template>
												
												<template if:true={isSupplierPriceEditable}>
													<lightning-input type="number" value={item.supplierUnitPrice}
														onchange={handleSupplierUnitPriceChange} data-id={item.rowKey} required="true"
														variant="label-hidden" step="any">
													</lightning-input>
												</template>
											</td>
										</tr>
									</template>
								</tbody>
							</table>
						</div>
					</lightning-card>

					<div class="slds-m-top_medium slds-text-align_right">
						<lightning-button label="Previous" variant="neutral" onclick={goToPage1}>
						</lightning-button>
						<lightning-button label="Next" variant="brand" class="slds-p-left_medium slds-p-right_medium"
						onclick={handleProcessOrder} disabled={isSaveDisabled}>
						</lightning-button>
					</div>

					<lightning-card>
						<div class="slds-tabs_default">
							<lightning-tabset>
								<lightning-tab label="Most Ordered Products">
									<div class="slds-p-around_medium">
										<template if:true={isNationalAccount}>
											<div
												class="slds-notify slds-notify_alert slds-theme_info slds-m-bottom_medium">
												Note: This Location is marked as 'IsNational' so only the Subscribed
												Products related to this Location are available, thank you.
											</div>
										</template>
										<template if:false={isNationalAccount}>
											<lightning-datatable
												key-field="Id"
												data={mostOrderedProducts}
												columns={mostProductColumns}
												hide-checkbox-column=true
												onrowaction={handleMostOrderedSelection}>
											</lightning-datatable>
										</template>
									</div>
								</lightning-tab>
								<lightning-tab label="Subscribed Products">
									<div class="slds-p-around_medium">
										<lightning-datatable
											key-field="Id"
											data={subscribedProducts}
											columns={subscribedProductColumns}
											hide-checkbox-column=true
											onrowaction={handleSubscribedSelection}>
										</lightning-datatable>
									</div>
								</lightning-tab>
								<lightning-tab label="All Products">
									<div class="slds-p-around_medium">
										<div class="slds-grid slds-wrap slds-p-bottom_medium">
											<div class="slds-col slds-size_1-of-2">
												<lightning-input type="search" label="Search Products" value={searchString}
													onchange={handleSearchChange} class="slds-p-right_small">
												</lightning-input>
											</div>
											<div class="slds-col slds-size_1-of-2">
												<lightning-record-picker label="Supplier" object-api-name="Suppliers__c"
													placeholder="Search Suppliers" value={selectedSupplierId} onchange={handleSupplierChange}
													filter={filter}>
												</lightning-record-picker>
											</div>

										</div>

										<template if:true={isNationalAccount}>
											<div
												class="slds-notify slds-notify_alert slds-theme_info slds-m-top_medium">
												Note: This Location is marked as 'IsNational' so only the Subscribed
												Products related to this Location are available, thank you.
											</div>
										</template>
										<template if:false={isNationalAccount}>
											<lightning-datatable
												key-field="Id"
												data={availableProducts}
												columns={productColumns}
												hide-checkbox-column=true
												onrowaction={handleRowAction}>
											</lightning-datatable>

											<template if:true={overLimit}>
												<div
													class="slds-notify slds-notify_alert slds-theme_warning slds-m-top_small">
													Your search returned over 30 results, use a more specific search
													string if you do not see the desired product.
												</div>
											</template>
										</template>
									</div>
								</lightning-tab>
							</lightning-tabset>
						</div>
					</lightning-card>
				</template>

				<template if:true={isPage3}>
					<lightning-card title="Order Summary">
						<div class="slds-p-around_top slds-p-around_bottom">
							<table class="slds-table slds-table_cell-buffer slds-table_bordered">
								<thead>
									<tr class="slds-text-title_caps">
										<th scope="col">Product</th>
										<th scope="col">Supplier</th>
										<th scope="col" class="slds-text-align_right">Quantity</th>
										<th scope="col">Disc Type</th>
										<th scope="col" class="slds-text-align_right">List Price</th>
										<th scope="col" class="slds-text-align_right">Disc Amount</th>
										<th scope="col" class="slds-text-align_right">Unit Price</th>
										<th scope="col" class="slds-text-align_right">Total Price</th>
									</tr>
								</thead>
								<tbody>
									<template for:each={orderData.orderItems} for:item="item" for:index="index">
										<tr key={item.rowKey}>
											<td><span class="slds-truncate slds-text-align_right">{item.manualProductName}</span></td>
											<td><span>{item.supplierName}</span></td>
											<td class="slds-text-align_right"><span>{item.quantity}</span></td>
											<td><span>{item.discountToApply}</span></td>
											<td class="slds-text-align_right"><span>{currencySign}{item.listPrice}</span></td>
											<td class="slds-text-align_right"><span>{currencySign}{item.discount}</span></td>
											<td class="slds-text-align_right"><span>{currencySign}{item.unitPrice}</span></td>
											<td class="slds-text-align_right"><span>{currencySign}{item.totalPrice}</span></td>
										</tr>
									</template>
								</tbody>
							</table>

							<div class="slds-grid slds-wrap slds-m-top_medium">
								<div class="slds-col slds-size_1-of-2">
									<div class="slds-text-heading_medium">
										Total: {currencySign}{orderData.totalPrice}
									</div>
								</div>
								<div class="slds-col slds-size_1-of-2">
									<div class="slds-text-heading_medium">
										Total Incl VAT: {currencySign}{orderData.totalPriceIncludingVat}
									</div>
								</div>
							</div>

							<div class="slds-m-top_medium slds-text-align_right">
								<lightning-button label="Cancel" variant="destructive-text" onclick={handleCancel} disabled={isSaving}>
								</lightning-button>

								<lightning-button label="Previous" variant="neutral" onclick={goToPage2} class="slds-p-left_medium" disabled={isSaving}>
								</lightning-button>

								<lightning-button label="Save" variant="brand" onclick={handleSave} class="slds-p-left_medium"
									disabled={isSaveDisabled}>
								</lightning-button>
							</div>
						</div>

						<template if:true={showConfirmationModal}>
							<div class="slds-modal slds-fade-in-open">
								<div class="slds-modal__container">
									<div class="slds-modal__header">
										<h2 class="slds-text-heading_medium">Confirm Payment</h2>
									</div>
									<div class="slds-modal__content slds-p-around_medium">
										<p>{confirmationMessage}</p>
									</div>
									<div class="slds-modal__footer">
										<lightning-button label="Confirm" variant="brand"
											onclick={handleConfirmPayment}>
										</lightning-button>
										<lightning-button label="Cancel" variant="destructive-text" onclick={handleCloseModal}>
										</lightning-button>
									</div>
								</div>
							</div>
							<div class="slds-backdrop slds-backdrop_open"></div>
						</template>

					</lightning-card>
				</template>
			</template>
		</lightning-card>
	</lightning-quick-action-panel>
</template>
