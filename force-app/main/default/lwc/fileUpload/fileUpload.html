<template>
  <lightning-card title="File Upload" icon-name="doctype:csv">
    <div class="slds-p-around_medium">
      <lightning-combobox
        name="Select object"
        label="Object"
        value={value}
        placeholder="Select Object"
        options={options}
        onchange={handleObjectChange}
      ></lightning-combobox>
    </div>
    <div class="slds-p-left_medium slds-p-bottom_x-small">
      <lightning-input
        type="file"
        label="Please upload CSV file."
        accept={acceptedFormats}
        onchange={handleFileUpload}
      >
      </lightning-input>
      <strong>Uploaded file:</strong> {fileName} <br /><br />
    </div>
    <div slot="footer">
      <lightning-button label="Clear" title="Clear" onclick={handleClear} class="slds-m-left_x-small"></lightning-button>
      <lightning-button label="Upload" title="Upload" onclick={handleConfirmClick} class="slds-m-left_x-small" disabled={disableUpload} variant="brand"></lightning-button>
    </div>

    <template if:true={loading}>
          <lightning-spinner alternative-text="Loading" variant="brand"></lightning-spinner>
    </template>
  </lightning-card>
</template>
